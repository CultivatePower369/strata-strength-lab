name: Build & Deploy to Cloudways

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudways via SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.SFTP_USERNAME }},$SFTP_PASSWORD" sftp://${{ secrets.SFTP_HOST }} -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --delete --verbose ./out/ /public_html/;
            bye
          "
