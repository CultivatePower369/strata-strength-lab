name: Build & Deploy to Cloudways

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Push built files to deploy branch
        run: |
          cd out
          git init
          git config user.email "info@cultivatepower.net"
          git config user.name "CultivatePower369"
          git add -A
          git commit -m "Deploy $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force https://CultivatePower369:${{ secrets.GH_TOKEN }}@github.com/CultivatePower369/strata-strength-lab.git HEAD:deploy
